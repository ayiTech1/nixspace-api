version: "3.9"

# ─────────────────────────────────────────────────────────────────────────────
# NixSpace — Local Development Stack
# Services: MySQL 8, Redis 7, Kafka (KRaft mode), Zookeeper-less single broker
# ─────────────────────────────────────────────────────────────────────────────

services:

  # ─── MySQL 8 ───────────────────────────────────────────────────────────────
  mysql:
    image: mysql:8.3
    container_name: nixspace-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE:      nixspace
      MYSQL_USER:          nixspace
      MYSQL_PASSWORD:      nixspace
    ports:
      - "3306:3306"
    volumes:
      - nixspace-mysql-data:/var/lib/mysql
      - ./docker/mysql/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    command: >
      --character-set-server=utf8mb4
      --collation-server=utf8mb4_unicode_ci
      --default-time-zone=+00:00
      --innodb-buffer-pool-size=256M
      --max-connections=200
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "nixspace", "-pnixspace"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  # ─── Redis 7 ───────────────────────────────────────────────────────────────
  redis:
    image: redis:7.2-alpine
    container_name: nixspace-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - nixspace-redis-data:/data
    command: redis-server --save 60 1 --loglevel warning --maxmemory 256mb --maxmemory-policy allkeys-lru
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  # ─── Zookeeper (Kafka dependency) ──────────────────────────────────────────
  zookeeper:
    image: confluentinc/cp-zookeeper:7.7.0
    container_name: nixspace-zookeeper
    restart: unless-stopped
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME:   2000
    volumes:
      - nixspace-zookeeper-data:/var/lib/zookeeper/data
      - nixspace-zookeeper-logs:/var/lib/zookeeper/log
    healthcheck:
      test: echo srvr | nc localhost 2181 | grep Mode
      interval: 10s
      timeout: 5s
      retries: 5

  # ─── Kafka ─────────────────────────────────────────────────────────────────
  kafka:
    image: confluentinc/cp-kafka:7.7.0
    container_name: nixspace-kafka
    restart: unless-stopped
    depends_on:
      zookeeper:
        condition: service_healthy
    ports:
      - "9092:9092"
      - "9093:9093"   # external listener (from host)
    environment:
      KAFKA_BROKER_ID:                        1
      KAFKA_ZOOKEEPER_CONNECT:                zookeeper:2181
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP:   INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_LISTENERS:                        INTERNAL://0.0.0.0:9092,EXTERNAL://0.0.0.0:9093
      KAFKA_ADVERTISED_LISTENERS:             INTERNAL://kafka:9092,EXTERNAL://localhost:9093
      KAFKA_INTER_BROKER_LISTENER_NAME:       INTERNAL
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE:        "true"
      KAFKA_LOG_RETENTION_HOURS:              168
      KAFKA_LOG_SEGMENT_BYTES:                1073741824
      KAFKA_LOG_RETENTION_CHECK_INTERVAL_MS:  300000
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
    volumes:
      - nixspace-kafka-data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD", "kafka-broker-api-versions", "--bootstrap-server", "localhost:9092"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 30s

  # ─── Kafka UI (optional dev tool) ──────────────────────────────────────────
  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    container_name: nixspace-kafka-ui
    restart: unless-stopped
    depends_on:
      kafka:
        condition: service_healthy
    ports:
      - "8090:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME:            local
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:9092
      DYNAMIC_CONFIG_ENABLED:           "true"

  # ─── NixSpace API ──────────────────────────────────────────────────────────
  nixspace-api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: nixspace-api
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      kafka:
        condition: service_healthy
    ports:
      - "8080:8080"
    environment:
      DB_HOST:       mysql
      DB_PORT:       3306
      DB_NAME:       nixspace
      DB_USER:       nixspace
      DB_PASSWORD:   nixspace
      REDIS_HOST:    redis
      REDIS_PORT:    6379
      KAFKA_HOSTS:   kafka:9092
      JWT_SECRET:    ${JWT_SECRET:-NixSpaceSuperSecretKeyChangeThisInProduction!}
      AWS_REGION:    ${AWS_REGION:-us-east-1}
      S3_BUCKET:     ${S3_BUCKET:-nixspace-files-local}
      SERVER_PORT:   8080
      JAVA_OPTS:     "-Xms256m -Xmx512m -XX:+UseG1GC"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/actuator/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s

volumes:
  nixspace-mysql-data:
  nixspace-redis-data:
  nixspace-zookeeper-data:
  nixspace-zookeeper-logs:
  nixspace-kafka-data:
